<svg viewBox="0 0 680 730" width="680" height="730" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, Helvetica, sans-serif">
<style>
.th{font-size:14px;font-weight:600}.ts{font-size:12px}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.ph{fill:none;stroke:#888780;stroke-width:1;stroke-dasharray:5 4}
.gray rect{fill:#F1EFE8;stroke:#5F5E5A}.gray .th{fill:#2C2C2A}.gray .ts{fill:#444441}
.teal rect{fill:#E1F5EE;stroke:#0F6E56}.teal .th{fill:#04342C}.teal .ts{fill:#085041}
.purple rect{fill:#EEEDFE;stroke:#534AB7}.purple .th{fill:#26215C}.purple .ts{fill:#3C3489}
.amber rect{fill:#FAEEDA;stroke:#854F0B}.amber .th{fill:#412402}.amber .ts{fill:#633806}
.green rect{fill:#EAF3DE;stroke:#3B6D11}.green .th{fill:#173404}.green .ts{fill:#27500A}
.blue rect{fill:#E6F1FB;stroke:#185FA5}.blue .th{fill:#042C53}.blue .ts{fill:#0C447C}
.coral rect{fill:#FAECE7;stroke:#993C1D}.coral .th{fill:#4A1B0C}.coral .ts{fill:#712B13}
rect{stroke-width:1}
.t{fill:#2C2C2A}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="730" fill="#FFFFFF" stroke="none"/>

<g class="gray"><rect x="240" y="16" width="200" height="56" rx="8"/>
<text class="th" x="340" y="38" text-anchor="middle">Seed data</text>
<text class="ts" x="340" y="58" text-anchor="middle">30 real physical receipts</text></g>
<line x1="340" y1="72" x2="340" y2="98" class="arr" marker-end="url(#arrow)"/>

<rect class="ph" x="40" y="100" width="600" height="124" rx="12"/>
<text class="th t" x="60" y="124">Phase 1: Programmatic data scaling</text>
<g class="teal"><rect x="60" y="138" width="250" height="68" rx="8"/>
<text class="th" x="185" y="164" text-anchor="middle">1. Text masking &amp; inpainting</text>
<text class="ts" x="185" y="184" text-anchor="middle">Creates blank canvas templates</text></g>
<g class="teal"><rect x="370" y="138" width="250" height="68" rx="8"/>
<text class="th" x="495" y="164" text-anchor="middle">2. PIL synthetic injection</text>
<text class="ts" x="495" y="184" text-anchor="middle">Overlays random fuel metrics</text></g>
<line x1="310" y1="172" x2="368" y2="172" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="224" x2="340" y2="250" class="arr" marker-end="url(#arrow)"/>

<rect class="ph" x="40" y="252" width="600" height="124" rx="12"/>
<text class="th t" x="60" y="276">Phase 2: AI validation &amp; prep</text>
<g class="purple"><rect x="60" y="290" width="250" height="68" rx="8"/>
<text class="th" x="185" y="316" text-anchor="middle">3. Few-shot VLM judge</text>
<text class="ts" x="185" y="336" text-anchor="middle">Filters visual errors, checks math</text></g>
<g class="purple"><rect x="370" y="290" width="250" height="68" rx="8"/>
<text class="th" x="495" y="316" text-anchor="middle">4. Albumentations pipeline</text>
<text class="ts" x="495" y="336" text-anchor="middle">Perspective warps, shadows, fade</text></g>
<line x1="310" y1="324" x2="368" y2="324" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="376" x2="340" y2="402" class="arr" marker-end="url(#arrow)"/>

<rect class="ph" x="40" y="404" width="600" height="226" rx="12"/>
<text class="th t" x="60" y="428">Phase 3: Model training &amp; evaluation split</text>
<g class="amber"><rect x="60" y="444" width="250" height="62" rx="8"/>
<text class="th" x="185" y="468" text-anchor="middle">Synthetic train set</text>
<text class="ts" x="185" y="488" text-anchor="middle">90% · ~1,000+ images</text></g>
<g class="green"><rect x="370" y="444" width="250" height="62" rx="8"/>
<text class="th" x="495" y="468" text-anchor="middle">Real-world test set</text>
<text class="ts" x="495" y="488" text-anchor="middle">10% · 30 real images</text></g>
<line x1="185" y1="506" x2="185" y2="546" class="arr" marker-end="url(#arrow)"/>
<line x1="495" y1="506" x2="495" y2="546" class="arr" marker-end="url(#arrow)"/>
<g class="blue"><rect x="60" y="548" width="250" height="62" rx="8"/>
<text class="th" x="185" y="572" text-anchor="middle">Local model training</text>
<text class="ts" x="185" y="592" text-anchor="middle">e.g. YOLO + Donut/OCR</text></g>
<g class="green"><rect x="370" y="548" width="250" height="62" rx="8"/>
<text class="th" x="495" y="572" text-anchor="middle">Production evaluation</text>
<text class="ts" x="495" y="592" text-anchor="middle">Generalization on smartphone noise</text></g>
<line x1="310" y1="579" x2="368" y2="579" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="630" x2="340" y2="656" class="arr" marker-end="url(#arrow)"/>

<g class="coral"><rect x="170" y="658" width="340" height="60" rx="8"/>
<text class="th" x="340" y="682" text-anchor="middle">Output</text>
<text class="ts" x="340" y="702" text-anchor="middle">Structured tabular telemetry (JSON)</text></g>
</svg>
